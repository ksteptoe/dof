[build-system]
requires = ["setuptools>=80", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "treasure-map"
dynamic = ["version"]
description = "CLI tool that scans directories for documents and maintains an Excel treasure map index."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kevin Steptoe" }]

# Runtime-only deps
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Docs extra: the single source of truth for the Sphinx toolchain.
# docs/requirements.txt (consumed by Read the Docs and tox) installs this extra,
# so the dependency set is declared here and nowhere else.
docs = [
    "sphinx>=7",
]

# Lint extra: THE single source of truth for the ruff version.
# Installed by the CI lint job (`pip install -e ".[lint]"`), pulled into `dev`
# below, and mirrored by the `rev:` pin in .pre-commit-config.yaml. Ruff ships
# new default rules and formatter changes in minor releases, so this is bounded
# on BOTH sides: an open `>=` lets a fresh ruff release turn CI red while local
# stays green. Bump the ceiling deliberately, and bump the pre-commit `rev:` in
# the same commit so all three agree.
lint = [
    "ruff>=0.16.1,<0.17",
]

# Dev extras: tests, coverage, linting, docs, releases
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5",
    # `make version` / `make release-show` run `python -m setuptools_scm` from the venv.
    # It is a [build-system] requirement too, but build isolation does not put it on the
    # venv path, so without this both targets fail with "No module named setuptools_scm".
    "setuptools-scm[toml]>=8",
    # Self-referential extras MUST name the *distribution* (`treasure-map`), not the
    # import package (`dof`) — see HANDOFF.md. `dof[docs]` breaks `pip install -e .[dev]`.
    "treasure-map[docs]",
    "treasure-map[lint]",
]

[project.urls]
Homepage = "https://github.com/ksteptoe/dof"
Repository = "https://github.com/ksteptoe/dof"
Documentation = "https://dof.readthedocs.io"
Changelog = "https://github.com/ksteptoe/dof/blob/main/CHANGELOG.rst"

[project.scripts]
# For Clickstart-style CLIs; adapt or remove if the project has no CLI
dof = "dof.cli:cli"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"
fallback_version = "0.0.0"
write_to = "src/dof/_version.py"

[tool.ruff]
line-length = 120
target-version = "py312"
# Ruff >= 0.16 also formats Python code blocks inside Markdown. Our Markdown is prose
# and design notes (PLAN.md, README.md, CLAUDE.md) whose snippets are illustrative, not
# shipped source, so `make lint` must not fail on them. CI lints `src tests` only and is
# unaffected either way; this keeps the local gate consistent with it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --disable-warnings --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: filesystem/external-tool tests",
  "live: tests that hit real external infrastructure; excluded from the default gates"
]

[tool.coverage.run]
branch = true
source = ["dof"]
omit = ["tests/*"]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# THE coverage gate. Read from here by `make test-all`, CI and any health script.
# Never duplicate this number in the Makefile, a workflow, or .coveragerc.
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self\\.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]
