ci:
  autoupdate_schedule: quarterly

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff version resolved by the `lint` extra in pyproject.toml
    # ("ruff>=0.16.1,<0.17"). Three places used to disagree — pyproject, this file,
    # and an unpinned `pip install ruff` in CI. Bump all of them together.
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0        # pin to a tag; update as needed
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict


  # If you want Black as well, uncomment this block and keep its rev pinned
  # - repo: https://github.com/psf/black
  #   rev: 24.10.0     # example pinned release
  #   hooks:
  #     - id: black
  #       args: ["--line-length=100"]
