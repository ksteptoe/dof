name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the project's own declared lint toolchain rather than a bare
      # `pip install ruff`. The version lives in exactly one place:
      # pyproject.toml [project.optional-dependencies] lint. Never pin ruff here.
      - name: Install lint toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      # `.` — not `src tests` — so CI checks exactly what `make lint` and the
      # pre-commit hooks check (docs/conf.py, tests/conftest.py, tooling scripts).
      # Markdown is excluded via [tool.ruff] extend-exclude in pyproject.toml.
      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Mirrors `make test-all`: same marker filter, same --cov target.
      # The coverage gate is NOT passed on the command line — it lives in
      # pyproject.toml under [tool.coverage.report] fail_under, which pytest-cov
      # honours automatically. One number, one place; do not add --cov-fail-under.
      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not live" --cov=dof --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for setuptools_scm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      # Catch packaging metadata errors (bad long_description, missing fields)
      # here rather than at `twine upload` time, when the tag is already pushed.
      - name: Check package metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
